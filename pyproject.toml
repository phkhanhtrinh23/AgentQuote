[project]
name = "agentquote"
version = "1.0.0"
description = "Multi-dimensional cost quotes for pay-as-you-go data-agent sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "matplotlib>=3.8",
    "sqlglot>=23.0",
]

[project.optional-dependencies]
live = ["openai>=1.30", "python-dotenv>=1.0", "earthengine-api>=0.1.390", "google-cloud-bigquery>=3.20", "db-dtypes"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentquote*"]
